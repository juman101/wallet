server:
  port: ${PORT:8080}

spring:
  application:
    name: wallet-transfer-service
  datasource:
    # DB_URL wins if set (e.g. docker-compose: jdbc:postgresql://postgres:5432/wallet). Otherwise
    # it's assembled from discrete host/port/name vars, which is what most managed-Postgres free
    # tiers (Render included) hand you instead of a ready-made jdbc: URL.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wallet}}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

logging:
  level:
    root: INFO
    com.paytm.wallet: INFO
